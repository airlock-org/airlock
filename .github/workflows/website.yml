name: Website checks

on:
  push:
    paths: ["website/**", "docs/**", "README.md", "CONTRIBUTING.md", "SECURITY.md", "THIRD_PARTY.md", "tests/test_website_docs.py", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "docs/**", "README.md", "CONTRIBUTING.md", "SECURITY.md", "THIRD_PARTY.md", "tests/test_website_docs.py", ".github/workflows/website.yml"]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: website/package.json
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Install locked website dependencies
        run: pnpm --dir website install --frozen-lockfile
      - name: Prepare Python checks
        run: uv sync --locked --python 3.12
      - name: Check TypeScript
        run: pnpm --dir website check
      - name: Build static website
        run: make website-build
      - name: Check publication and exported site
        env:
          AIRLOCK_WEBSITE_OUT: ${{ github.workspace }}/website/out
        run: uv run --no-sync pytest tests/test_website_docs.py --junitxml=.airlock-logs/website-junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: website-checks
          path: |
            website/out/
            .airlock-logs/website-junit.xml
          include-hidden-files: true
          retention-days: 7
