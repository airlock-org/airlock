name: Quick checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIRLOCK_DATA_ROOT: ${{ github.workspace }}/.airlock/ci-data
      AIRLOCK_LOG_DIR: ${{ github.workspace }}/.airlock-logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.AIRLOCK_CI_READ_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Prepare host tools
        run: sudo apt-get update && sudo apt-get install -y jq util-linux e2fsprogs ripgrep
      - name: Prepare locked Python dependencies
        run: uv sync --locked --python 3.12
      - name: Run quick suite
        run: make test-quick PYTEST_ARGS=-q
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quick-test-reports
          path: .airlock-logs/
          include-hidden-files: true
          retention-days: 7
