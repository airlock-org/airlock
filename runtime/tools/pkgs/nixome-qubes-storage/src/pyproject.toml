[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nixome-qubes-storage"
version = "0.1.0"
description = "Nixome closure-backed Qubes storage adapter and immutable store engine"
requires-python = ">=3.11"

[project.scripts]
nixome-closure-store = "nixome_qubes_storage.cli:main"

[project.entry-points."qubes.storage"]
nixome-closure = "nixome_qubes_storage.qubes:ClosurePool"
