[package]
name = "airlock-diagnostics"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Scoped read-only diagnostic requests over Qubes RPC"

[features]
default = []
runtime = ["dep:rustix", "dep:clap"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vstd = "=0.0.0-2026-10-18-0147"
rustix = { version = "1.1", features = ["fs", "event", "process"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "airlock-diagnostics"
path = "src/bin/airlock-diagnostics.rs"
required-features = ["runtime"]

[[bin]]
name = "airlock-diagnostics-relay"
path = "src/bin/airlock-diagnostics-relay.rs"
required-features = ["runtime"]

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
