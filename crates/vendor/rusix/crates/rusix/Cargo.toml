[package]
name = "rusix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed Rust authoring, compilation and isolated evaluation for Nix"
repository.workspace = true
documentation = "https://docs.rs/rusix"
keywords = ["nix", "nixos", "configuration", "code-generation"]
categories = ["config", "development-tools::build-utils"]
include = ["src/**", "README.md", "LICENSE", "LICENSE-NIXPKGS", "NOTICE"]
readme.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["evaluation"]
evaluation = ["dep:tempfile"]
dev-cli = ["evaluation"]

[[bin]]
name = "rusix"
path = "src/bin/rusix.rs"
required-features = ["dev-cli"]

[dev-dependencies]
tempfile.workspace = true

[dependencies]
rusix-derive = { path = "../rusix-derive", version = "=0.1.1" }
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
sha2.workspace = true

[[example]]
name = "enum-option"
path = "../../examples/enum-option.rs"

[[example]]
name = "typed-submodule"
path = "../../examples/typed-submodule.rs"

[[example]]
name = "invalid-states"
path = "../../examples/invalid-states.rs"

[[example]]
name = "function-contracts"
path = "../../examples/function-contracts.rs"

[[example]]
name = "exhaustive-match"
path = "../../examples/exhaustive-match.rs"

[[example]]
name = "typed-values"
path = "../../examples/typed-values.rs"

[[example]]
name = "layered-validation"
path = "../../examples/layered-validation.rs"

[[example]]
name = "nix-interop"
path = "../../examples/nix-interop.rs"

[[example]]
name = "symbolic-option"
path = "../../examples/symbolic-option.rs"

[[example]]
name = "postgresql-nixos-module"
