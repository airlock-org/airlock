User tinyproxy
Group tinyproxy
Port 8082
Timeout 60
DefaultErrorFile "@tinyproxy@/share/tinyproxy/default.html"
StatFile "@tinyproxy@/share/tinyproxy/stats.html"
Syslog On
LogLevel Notice
PidFile "/run/tinyproxy-updates/tinyproxy.pid"

MaxClients 50
DisableViaHeader Yes

Allow 127.0.0.1
Allow 10.137.0.0/16

ConnectPort 443
ConnectPort 873

Filter "@agent@/etc/tinyproxy/updates-blacklist"
