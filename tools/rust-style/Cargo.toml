[package]
name = "airlock-rust-style"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Development-only structural Rust formatting checks for Airlock"

[[bin]]
name = "check-rust-spacing"
path = "src/main.rs"

# Keep parser dependencies out of the application workspace and shipped closures.
[workspace]

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3.0"
