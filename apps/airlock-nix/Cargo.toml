[package]
name = "airlock-nix"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Typed review, jobs and deployment orchestration for Airlock Nix management"

[features]
default = []
client = []
service = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
rustix = { version = "1.1", features = ["fs", "event", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.0"
thiserror = "2.0"
