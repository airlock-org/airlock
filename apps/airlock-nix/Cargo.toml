[package]
name = "airlock-nix"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Typed foundations and local record inspection for Airlock Nix management"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
