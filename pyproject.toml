[project]
name = "nixome"
version = "0.1.0"
description = "Developer tooling for Nixome"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=25.1.0",
    "radon>=6.0.1",
    "ruff>=0.13.0",
    "xenon>=0.9.3",
]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.nixome-.*
  | result-.*
  | result
  | vendor
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".nixome-*",
    ".ruff_cache",
    ".venv",
    "result",
    "result-*",
    "vendor",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
