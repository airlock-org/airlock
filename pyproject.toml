[project]
name = "airlock"
version = "0.1.0"
description = "Developer tooling for Airlock"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.3.0",
    "pytest-json-report>=1.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "radon>=6.0.1",
    "ruff>=0.13.0",
    "xenon>=0.9.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 1800
markers = [
    "config_vm_staged: config VM integration flow split into pytest-visible stages",
    "local: local checks that should pass on ordinary NixOS development hosts",
    "nix: checks that evaluate or build Nix artifacts",
    "qubes: checks that require Qubes/Xen runtime support",
    "prebuild: shared build/cache preparation for later VM flows",
    "slow: checks that can take noticeably longer than ordinary unit tests",
    "staged_vm: nested VM integration flow split into pytest-visible stages",
    "serial_vm: VM flow that should not be included in multi-lane VM runs",
    "vm: nested VM integration flows",
    "warm: warm nested VM iteration flows",
    "warm_extra: additional warm VM coverage beyond the config staged path",
    "xdist_group: pytest-xdist worker group",
]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.airlock-.*
  | result-.*
  | result
  | vendor
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".airlock-*",
    ".ruff_cache",
    ".venv",
    "result",
    "result-*",
    "vendor",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
