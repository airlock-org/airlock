[project]
name = "airlock"
version = "0.1.0"
description = "Developer tooling for Airlock"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "radon>=6.0.1",
    "ruff>=0.13.0",
    "xenon>=0.9.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".airlock-*",
    ".ruff_cache",
    ".venv",
    "result",
    "result-*",
    "vendor",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
